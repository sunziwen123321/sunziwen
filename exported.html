<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>锤子在线工具(toolhelper.cn)</title>
</head>
<body>
	<p id="demo">单击按钮显示指定 UTF-8 编码的字符。</p>
	<button onclick="myFunction()">点我</button>
	<script>
		function myFunction(){
			var n=String.fromCharCode(72,69,76,76,79);
			document.getElementById("demo").innerHTML=n;
		}
	</script>
</body>
</html>
